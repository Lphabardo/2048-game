<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>2048 Puzzle</title>
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#faf8ef">
    <style>
        :root{--bg:#faf8ef;--grid:#bbada0;--cell:rgba(238,228,218,.35);--orange:#ff9500;--green:#34c759;--red:#ff3b30;}
        *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;user-select:none;-webkit-tap-highlight-color:transparent;}
        input,textarea{user-select:text;-webkit-user-select:text;}
        html,body{width:100%;height:100%;background:var(--bg);overflow:hidden;}
        .screen{position:fixed;inset:0;transition:opacity .3s,transform .3s;}
        .screen.hidden{opacity:0;pointer-events:none;transform:scale(.98);}

        /* ── ИГРА ── */
        #game-app{display:flex;flex-direction:column;align-items:center;justify-content:space-between;
                  padding:20px 16px env(safe-area-inset-bottom);background:var(--bg);}
        .g-header{width:100%;max-width:420px;display:flex;justify-content:space-between;align-items:center;
                  margin-top:env(safe-area-inset-top);}
        .g-title{font-size:48px;font-weight:800;color:#776e65;line-height:1;cursor:pointer;
                 -webkit-touch-callout:none;}
        .scores{display:flex;gap:8px;}
        .score-box{background:#bbada0;padding:8px 16px;border-radius:6px;text-align:center;color:#fff;min-width:75px;}
        .score-lbl{font-size:11px;text-transform:uppercase;color:#eee4da;font-weight:700;}
        .score-val{font-size:20px;font-weight:700;}
        .g-controls{width:100%;max-width:420px;display:flex;justify-content:space-between;align-items:center;margin:14px 0;}
        .g-intro{font-size:14px;color:#776e65;}
        .new-btn{background:#8f7a66;color:#f9f6f2;border:none;padding:10px 16px;border-radius:6px;font-weight:700;font-size:14px;cursor:pointer;}
        .grid-wrap{width:100%;max-width:420px;aspect-ratio:1;background:var(--grid);border-radius:12px;
                   padding:10px;display:grid;grid-template-columns:repeat(4,1fr);
                   grid-template-rows:repeat(4,1fr);gap:10px;position:relative;touch-action:none;}
        .gcell{background:var(--cell);border-radius:6px;}
        .tile{position:absolute;border-radius:6px;display:flex;align-items:center;justify-content:center;
              font-weight:700;transition:top .1s,left .1s;}
        .t2{background:#eee4da;color:#776e65;}
        .t4{background:#ede0c8;color:#776e65;}
        .t8{background:#f2b179;color:#f9f6f2;}
        .t16{background:#f59563;color:#f9f6f2;}
        .t32{background:#f67c5f;color:#f9f6f2;}
        .t64{background:#f65e3b;color:#f9f6f2;}
        .t128{background:#edcf72;color:#f9f6f2;}
        .t256{background:#edcc61;color:#f9f6f2;}
        .t512{background:#edc850;color:#f9f6f2;}
        .t1024{background:#edc53f;color:#f9f6f2;}
        .t2048{background:#edc22e;color:#f9f6f2;}
        .thigh{background:#3c3a32;color:#f9f6f2;}

        /* ── ЧАТ ── */
        #cht{background:#0a0a0a;display:flex;flex-direction:column;}
        #hdr{background:#111;padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top));
             border-bottom:.5px solid #1e1e1e;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
        .hdr-l{display:flex;flex-direction:column;}
        #htitle{color:#fff;font-size:17px;font-weight:600;}
        #status{font-size:12px;color:#555;margin-top:2px;transition:color .3s;}
        #status.on{color:var(--green);}
        .hdr-btns{display:flex;align-items:center;gap:4px;}
        .hbtn{background:none;border:none;cursor:pointer;padding:6px 8px;border-radius:8px;font-size:15px;}
        #clear-btn{color:var(--red);}
        #close-btn{color:var(--orange);}
        #msgs{flex:1;overflow-y:auto;padding:16px 12px;display:flex;flex-direction:column;gap:4px;}
        #msgs::-webkit-scrollbar{width:0;}
        .mw{display:flex;flex-direction:column;animation:mi .2s ease;}
        @keyframes mi{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
        .mw.me{align-items:flex-end;}.mw.them{align-items:flex-start;}
        .mw+.mw{margin-top:2px;}.mw.me+.mw.them,.mw.them+.mw.me{margin-top:12px;}
        .lbl{font-size:11px;color:#555;margin-bottom:3px;padding:0 4px;}
        .bbl{max-width:76%;padding:9px 13px;border-radius:18px;font-size:15px;line-height:1.45;color:#fff;word-wrap:break-word;}
        .mw.me .bbl{background:#0a7aff;border-bottom-right-radius:5px;}
        .mw.them .bbl{background:#1c1c1e;border-bottom-left-radius:5px;}
        .bbl img{max-width:100%;border-radius:12px;display:block;}
        .ts{font-size:10px;color:#444;margin-top:3px;padding:0 4px;}
        #empty{display:none;flex-direction:column;align-items:center;justify-content:center;
               flex:1;color:#333;font-size:14px;gap:8px;text-align:center;padding:24px;}
        #empty.show{display:flex;}
        #empty span{font-size:40px;}
        #nm{position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(12px);
            display:flex;align-items:center;justify-content:center;z-index:300;padding:24px;}
        #nm.hidden{display:none;}
        .card{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:20px;padding:28px 24px;width:100%;max-width:340px;}
        .card h2{color:#fff;font-size:20px;font-weight:600;margin-bottom:8px;}
        .card p{color:#888;font-size:14px;margin-bottom:20px;line-height:1.4;}
        #ni{width:100%;background:#2a2a2a;border:1px solid #333;border-radius:12px;
            padding:13px 16px;color:#fff;font-size:16px;outline:none;margin-bottom:14px;}
        #ni:focus{border-color:var(--orange);}
        #nok{width:100%;background:var(--orange);color:#000;border:none;border-radius:12px;
             padding:13px;font-size:16px;font-weight:600;cursor:pointer;}
        #ia{background:#111;border-top:.5px solid #1e1e1e;padding:10px 12px;
            padding-bottom:calc(10px + env(safe-area-inset-bottom));
            display:flex;align-items:flex-end;gap:10px;flex-shrink:0;}
        #mi{flex:1;background:#1c1c1e;border:none;border-radius:20px;padding:10px 14px;
            color:#fff;font-size:16px;outline:none;resize:none;max-height:120px;overflow-y:auto;line-height:1.4;}
        #mi::placeholder{color:#555;}
        #sb{background:var(--orange);border:none;border-radius:50%;width:36px;height:36px;
            display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
        #sb svg{width:18px;height:18px;fill:#000;}

        /* ── ДИАЛОГ ОЧИСТКИ ── */
        #confirm-dialog{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);
                        display:none;align-items:center;justify-content:center;z-index:300;padding:24px;}
        #confirm-dialog.show{display:flex;}
        .confirm-card{background:#1c1c1e;border:1px solid #3a3a3c;border-radius:16px;
                      padding:24px;width:100%;max-width:300px;text-align:center;}
        .confirm-title{color:#fff;font-size:17px;font-weight:600;margin-bottom:8px;}
        .confirm-sub{color:#8e8e93;font-size:14px;margin-bottom:20px;line-height:1.4;}
        .confirm-btns{display:flex;gap:12px;}
        .confirm-cancel{flex:1;background:#2c2c2e;color:#fff;border:none;border-radius:12px;padding:13px;font-size:16px;cursor:pointer;}
        .confirm-ok{flex:1;background:var(--red);color:#fff;border:none;border-radius:12px;padding:13px;font-size:16px;font-weight:600;cursor:pointer;}

        #toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(10px);
               background:#222;color:#fff;padding:8px 16px;border-radius:20px;font-size:13px;
               opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:400;white-space:nowrap;}
        #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
    </style>
</head>
<body>

<!-- ══ ИГРА ══ -->
<div id="game-app" class="screen">
    <div class="g-header">
        <!-- Зажать плитку 16 долго — открыть чат -->
        <div class="g-title">2048</div>
        <div class="scores">
            <div class="score-box"><div class="score-lbl">Счёт</div><div class="score-val" id="score">0</div></div>
            <div class="score-box"><div class="score-lbl">Рекорд</div><div class="score-val" id="best">0</div></div>
        </div>
    </div>
    <div class="g-controls">
        <div class="g-intro">Соединяйте плитки!</div>
        <button class="new-btn" onclick="initGame()">Новая игра</button>
    </div>
    <div class="grid-wrap" id="grid">
        <div class="gcell"></div><div class="gcell"></div><div class="gcell"></div><div class="gcell"></div>
        <div class="gcell"></div><div class="gcell"></div><div class="gcell"></div><div class="gcell"></div>
        <div class="gcell"></div><div class="gcell"></div><div class="gcell"></div><div class="gcell"></div>
        <div class="gcell"></div><div class="gcell"></div><div class="gcell"></div><div class="gcell"></div>
    </div>
</div>

<!-- ══ ЧАТ ══ -->
<div id="cht" class="screen hidden">
    <div id="nm">
        <div class="card">
            <h2>Ваше имя</h2>
            <p>Введите имя — оно будет видно собеседнику. Выбирается один раз.</p>
            <input id="ni" type="text" placeholder="Например: Саша" maxlength="20" autocomplete="off">
            <button id="nok" onclick="saveNick()">Войти в чат</button>
        </div>
    </div>
    <div id="hdr">
        <div class="hdr-l">
            <div id="htitle">🔒 Личный чат</div>
            <div id="status">подключение...</div>
        </div>
        <div class="hdr-btns">
            <button class="hbtn" id="clear-btn" onclick="askClear()">🗑</button>
            <button class="hbtn" id="close-btn" onclick="closeChat()">Выйти</button>
        </div>
    </div>
    <div id="msgs">
        <div id="empty" class="show"><span>💬</span>Сообщений пока нет.<br>Напишите что-нибудь!</div>
    </div>
    <div id="ia">
        <button onclick="document.getElementById('fi').click()" style="background:none;border:none;color:var(--orange);font-size:26px;cursor:pointer;padding:4px;flex-shrink:0;line-height:1;">📷</button>
        <input type="file" id="fi" accept="image/*" style="display:none" onchange="sendPhoto(this)">
        <textarea id="mi" placeholder="Сообщение..." rows="1" autocomplete="off"></textarea>
        <button id="sb" onclick="sendMsg()">
            <svg viewBox="0 0 24 24"><path d="M2 21L23 12 2 3v7l15 2-15 2z"/></svg>
        </button>
    </div>
</div>

<!-- ДИАЛОГ ОЧИСТКИ -->
<div id="confirm-dialog">
    <div class="confirm-card">
        <div class="confirm-title">Очистить чат?</div>
        <div class="confirm-sub">Все сообщения удалятся у обоих. Это нельзя отменить.</div>
        <div class="confirm-btns">
            <button class="confirm-cancel" onclick="hideClear()">Отмена</button>
            <button class="confirm-ok" onclick="clearChat()">Удалить</button>
        </div>
    </div>
</div>

<div id="toast"></div>

<script>
// ════════════════════════════════════
// SUPABASE
// ════════════════════════════════════
const SB_URL='https://lxaatqgcfsrvycanbelm.supabase.co';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx4YWF0cWdjZnNydnljYW5iZWxtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA4MjU0ODIsImV4cCI6MjA5NjQwMTQ4Mn0.z-Pl30UQh-3GPrE6ezztZngP3fjm_vIwm9IpYkX1zfA';
const ROOM='main';
const SBH={'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json','Prefer':'return=representation'};
const dbGet=async q=>{const r=await fetch(SB_URL+'/rest/v1/'+q,{headers:SBH});if(!r.ok)throw 0;return r.json();};
const dbPost=async b=>{const r=await fetch(SB_URL+'/rest/v1/messages',{method:'POST',headers:SBH,body:JSON.stringify(b)});if(!r.ok)throw 0;return r.json();};
const dbDel=async()=>fetch(SB_URL+'/rest/v1/messages?room=eq.'+ROOM,{method:'DELETE',headers:SBH}).catch(()=>{});
const pad=n=>String(n).padStart(2,'0');

// ════════════════════════════════════
// СЕКРЕТНЫЙ ВХОД — зажать "2048" 3 сек
// ════════════════════════════════════
let holdTimer=null;
function startHold(e){
    if(e&&e.cancelable)e.preventDefault();
    holdTimer=setTimeout(()=>{holdTimer=null;openChat();},3000);
}
function endHold(){if(holdTimer){clearTimeout(holdTimer);holdTimer=null;}}

// ════════════════════════════════════
// ИГРА 2048
// ════════════════════════════════════
let board=Array(16).fill(0);
let score=0;
let best=parseInt(localStorage.getItem('2048_best')||'0');

function initGame(){
    board=Array(16).fill(0);
    score=0;
    addTile();addTile();
    renderGame();
}

function addTile(){
    const empty=board.map((v,i)=>v===0?i:null).filter(v=>v!==null);
    if(empty.length){
        board[empty[Math.floor(Math.random()*empty.length)]]=Math.random()<.9?2:4;
    }
}

function tileClass(v){
    if(v<=2048)return 't'+v;
    return 'thigh';
}

function tileFontSize(v){
    if(v<128)return'28px';
    if(v<1024)return'22px';
    return'18px';
}

function renderGame(){
    document.getElementById('score').textContent=score;
    document.getElementById('best').textContent=best;
    const grid=document.getElementById('grid');
    document.querySelectorAll('.tile').forEach(t=>t.remove());
    const pad10=10,gap=10;
    const gw=grid.clientWidth;
    const cell=(gw-pad10*2-gap*3)/4;
    board.forEach((v,i)=>{
        if(!v)return;
        const r=Math.floor(i/4),c=i%4;
        const tile=document.createElement('div');
        tile.className='tile '+tileClass(v);
        tile.textContent=v;
        tile.style.cssText=`width:${cell}px;height:${cell}px;top:${pad10+r*(cell+gap)}px;left:${pad10+c*(cell+gap)}px;font-size:${tileFontSize(v)};`;
        if(v===16){
            tile.onmousedown=startHold;
            tile.onmouseup=endHold;
            tile.onmouseleave=endHold;
            tile.ontouchstart=startHold;
            tile.ontouchend=endHold;
            tile.ontouchcancel=endHold;
        }
        grid.appendChild(tile);
    });
}

function slide(row){
    let a=row.filter(v=>v);
    return a.concat(Array(4-a.length).fill(0));
}
function combine(row){
    for(let i=0;i<3;i++){
        if(row[i]&&row[i]===row[i+1]){
            row[i]*=2;score+=row[i];
            if(score>best){best=score;localStorage.setItem('2048_best',best);}
            row[i+1]=0;
        }
    }
    return row;
}
function moveLeft(){
    let changed=false;
    for(let i=0;i<4;i++){
        let row=board.slice(i*4,i*4+4);
        const orig=[...row];
        row=slide(combine(slide(row)));
        row.forEach((v,j)=>{board[i*4+j]=v;if(orig[j]!==v)changed=true;});
    }
    return changed;
}
function rotate(){
    const nb=Array(16).fill(0);
    for(let r=0;r<4;r++)for(let c=0;c<4;c++)nb[c*4+(3-r)]=board[r*4+c];
    board=nb;
}
function move(dir){
    const rots={left:0,down:1,right:2,up:3};
    const n=rots[dir];
    for(let i=0;i<n;i++)rotate();
    const moved=moveLeft();
    for(let i=0;i<(4-n)%4;i++)rotate();
    if(moved){addTile();renderGame();}
}

// Свайпы
let tx=0,ty=0;
const grid=document.getElementById('grid');
grid.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
grid.addEventListener('touchend',e=>{
    const dx=e.changedTouches[0].clientX-tx;
    const dy=e.changedTouches[0].clientY-ty;
    if(Math.abs(dx)>Math.abs(dy)){if(Math.abs(dx)>30)move(dx>0?'right':'left');}
    else{if(Math.abs(dy)>30)move(dy>0?'down':'up');}
    tx=0;ty=0;
},{passive:true});
document.addEventListener('keydown',e=>{
    const m={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down'};
    if(m[e.key]){e.preventDefault();move(m[e.key]);}
});

initGame();

// ════════════════════════════════════
// ЧАТ
// ════════════════════════════════════
let myName=localStorage.getItem('game_nick')||'';
let myUid=localStorage.getItem('game_uid');
if(!myUid){myUid=crypto.randomUUID();localStorage.setItem('game_uid',myUid);}
let lastId=0,pollTimer=null;

async function poll(){
    try{
        const data=await dbGet('messages?room=eq.'+ROOM+'&id=gt.'+lastId+'&order=id.asc&limit=50');
        // Если сообщения исчезли — чат очищен другим пользователем
        if(data.length===0&&lastId>0){
            const check=await dbGet('messages?room=eq.'+ROOM+'&limit=1');
            if(check.length===0){clearMsgsUI();lastId=0;}
        }
        data.forEach(m=>{render(m);if(m.id>lastId)lastId=m.id;});
        setStatus(true);
    }catch(e){setStatus(false);}
}
function startPoll(){poll();pollTimer=setInterval(poll,2000);}
function stopPoll(){clearInterval(pollTimer);pollTimer=null;}

function render(m){
    const box=document.getElementById('msgs');
    document.getElementById('empty').classList.remove('show');
    const isMe=m.uid===myUid;
    const wrap=document.createElement('div');
    wrap.className='mw '+(isMe?'me':'them');
    wrap.dataset.uid=m.uid;
    if(!isMe){
        const prev=box.lastElementChild;
        if(!prev||prev.dataset.uid!==m.uid){
            const l=document.createElement('div');l.className='lbl';l.textContent=m.name;wrap.appendChild(l);
        }
    }
    const b=document.createElement('div');b.className='bbl';
    if(m.text&&m.text.startsWith('📷 ')){
        const img=document.createElement('img');
        img.src=m.text.slice(3);
        img.style.cssText='max-width:100%;border-radius:12px;display:block;';
        img.loading='lazy';b.appendChild(img);
    }else{b.textContent=m.text;}
    wrap.appendChild(b);
    const t=document.createElement('div');t.className='ts';
    t.textContent=new Date(m.created_at).toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'});
    wrap.appendChild(t);
    box.appendChild(wrap);
    box.scrollTop=box.scrollHeight;
}

function clearMsgsUI(){
    document.getElementById('msgs').innerHTML='<div id="empty" class="show"><span>💬</span>Сообщений пока нет.<br>Напишите что-нибудь!</div>';
}

async function sendMsg(){
    const inp=document.getElementById('mi');
    const txt=inp.value.trim();if(!txt)return;
    inp.value='';inp.style.height='auto';
    try{
        const saved=await dbPost({room:ROOM,uid:myUid,name:myName,text:txt});
        if(saved&&saved[0]){render(saved[0]);lastId=saved[0].id;}
    }catch(e){toast('Ошибка отправки');}
}

async function sendPhoto(input){
    const file=input.files[0];if(!file)return;input.value='';
    toast('Загружаем фото...');
    try{
        const ext=file.name.split('.').pop();
        const path=ROOM+'/'+Date.now()+'.'+ext;
        const r=await fetch(SB_URL+'/storage/v1/object/chat-images/'+path,{
            method:'POST',
            headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':file.type},
            body:file
        });
        if(!r.ok)throw 0;
        const img_url=SB_URL+'/storage/v1/object/public/chat-images/'+path;
        const saved=await dbPost({room:ROOM,uid:myUid,name:myName,text:'📷 '+img_url});
        if(saved&&saved[0]){render(saved[0]);lastId=saved[0].id;}
        toast('Фото отправлено');
    }catch(e){toast('Ошибка загрузки фото');}
}

function saveNick(){
    const v=document.getElementById('ni').value.trim();if(!v)return;
    myName=v;localStorage.setItem('game_nick',myName);
    document.getElementById('nm').classList.add('hidden');
    startPoll();
}

function openChat(){
    document.getElementById('game-app').classList.add('hidden');
    document.getElementById('cht').classList.remove('hidden');
    if(!myName){
        document.getElementById('nm').classList.remove('hidden');
        setTimeout(()=>document.getElementById('ni').focus(),100);
    }else{
        document.getElementById('nm').classList.add('hidden');
        startPoll();
    }
}

function closeChat(){
    stopPoll();lastId=0;
    document.getElementById('cht').classList.add('hidden');
    document.getElementById('game-app').classList.remove('hidden');
}

function askClear(){document.getElementById('confirm-dialog').classList.add('show');}
function hideClear(){document.getElementById('confirm-dialog').classList.remove('show');}
async function clearChat(){
    hideClear();
    await dbDel();
    clearMsgsUI();
    lastId=0;
    toast('Чат очищен');
}

function setStatus(ok){
    const el=document.getElementById('status');
    el.textContent=ok?'в сети':'нет соединения';
    el.className=ok?'on':'';
}
function toast(msg){
    const t=document.getElementById('toast');
    t.textContent=msg;t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'),2500);
}

document.getElementById('mi').addEventListener('input',function(){
    this.style.height='auto';this.style.height=Math.min(this.scrollHeight,120)+'px';
});
document.getElementById('mi').addEventListener('keypress',function(e){
    if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg();}
});
document.getElementById('ni').addEventListener('keypress',function(e){
    if(e.key==='Enter')saveNick();
});

if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
