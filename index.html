<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>2048 Puzzle</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="ВСТАВЬ_СЮДА_СВОЮ_ССЫЛКУ">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#faf8ef">
    <style>
        :root {
            --bg-color: #faf8ef;
            --grid-bg: #bbada0;
            --cell-bg: rgba(238, 228, 218, 0.35);
            --orange: #ff9500;
            --green: #34c759;
            --red: #ff3b30;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
        input, textarea { user-select: text; -webkit-user-select: text; }
        html, body { width: 100%; height: 100%; background: var(--bg-color); overflow: hidden; }
        
        .screen { position: fixed; inset: 0; transition: opacity .3s, transform .3s; }
        .screen.hidden { opacity: 0; pointer-events: none; transform: scale(.98); }

        /* GAME STYLES */
        #game-app { display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 20px 16px env(safe-area-inset-bottom); background: var(--bg-color); }
        .header { width: 100%; max-width: 400px; display: flex; justify-content: space-between; align-items: center; margin-top: env(safe-area-inset-top); }
        .title { font-size: 48px; font-weight: 800; color: #776e65; line-height: 1; cursor: pointer; }
        .scores { display: flex; gap: 8px; }
        .score-box { background: #bbada0; padding: 8px 16px; border-radius: 6px; text-align: center; color: #fff; min-width: 75px; }
        .score-label { font-size: 11px; text-transform: uppercase; color: #eee4da; font-weight: 700; }
        .score-val { font-size: 20px; font-weight: 700; }

        .controls { width: 100%; max-width: 400px; display: flex; justify-content: space-between; align-items: center; margin: 16px 0; }
        .game-intro { font-size: 14px; color: #776e65; }
        .restart-btn { background: #8f7a66; color: #f9f6f2; border: none; padding: 10px 16px; border-radius: 6px; font-weight: 700; font-size: 14px; cursor: pointer; }

        .grid-container { width: 100%; max-width: 400px; height: 400px; background: var(--grid-bg); border-radius: 12px; padding: 12px; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr); gap: 12px; position: relative; touch-action: none; }
        .cell { background: var(--cell-bg); border-radius: 6px; }
        
        .tile { position: absolute; width: calc((100% - 60px) / 4); height: calc((100% - 60px) / 4); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 700; transition: all 0.1s ease-in-out; }
        .tile-2 { background: #eee4da; color: #776e65; }
        .tile-4 { background: #ede0c8; color: #776e65; }
        .tile-8 { background: #f2b179; color: #f9f6f2; }
        .tile-16 { background: #f59563; color: #f9f6f2; }
        .tile-32 { background: #f67c5f; color: #f9f6f2; }
        .tile-64 { background: #f65e3b; color: #f9f6f2; }
        .tile-128 { background: #edcf72; color: #f9f6f2; font-size: 22px; }
        .tile-256 { background: #edcc61; color: #f9f6f2; font-size: 22px; }
        .tile-512 { background: #edc850; color: #f9f6f2; font-size: 22px; }
        .tile-1024 { background: #edc53f; color: #f9f6f2; font-size: 18px; }
        .tile-2048 { background: #edc22e; color: #f9f6f2; font-size: 18px; }

        /* CHAT STYLES */
        #cht { background: #0a0a0a; display: flex; flex-direction: column; }
        #hdr { background: #111; padding: 14px 16px; padding-top: calc(14px + env(safe-area-inset-top)); border-bottom: .5px solid #1e1e1e; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
        #htitle { color: #fff; font-size: 17px; font-weight: 600; }
        #status { font-size: 12px; color: #555; margin-top: 2px; transition: color .3s; }
        #status.on { color: var(--green); }
        #xbtn { background: none; border: none; color: var(--orange); font-size: 15px; cursor: pointer; }
        #msgs { flex: 1; overflow-y: auto; padding: 16px 12px; display: flex; flex-direction: column; gap: 4px; }
        #msgs::-webkit-scrollbar { width: 0; }
        .mw { display: flex; flex-direction: column; animation: mi .2s ease; }
        @keyframes mi { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .mw.me { align-items: flex-end; } .mw.them { align-items: flex-start; }
        .mw+.mw { margin-top: 2px; } .mw.me+.mw.them, .mw.them+.mw.me { margin-top: 12px; }
        .lbl { font-size: 11px; color: #555; margin-bottom: 3px; padding: 0 4px; }
        .bbl { max-width: 76%; padding: 9px 13px; border-radius: 18px; font-size: 15px; line-height: 1.45; color: #fff; word-wrap: break-word; }
        .mw.me .bbl { background: #0a7aff; border-bottom-right-radius: 5px; }
        .mw.them .bbl { background: #1c1c1e; border-bottom-left-radius: 5px; }
        .ts { font-size: 10px; color: #444; margin-top: 3px; padding: 0 4px; }
        #empty { display: none; flex-direction: column; align-items: center; justify-content: center; flex: 1; color: #333; font-size: 14px; gap: 8px; text-align: center; padding: 24px; }
        #empty.show { display: flex; }
        #empty span { font-size: 40px; }
        #nm { position: fixed; inset: 0; background: rgba(0,0,0,.85); backdrop-filter: blur(12px); display: flex; align-items: center; justify-content: center; z-index: 300; padding: 24px; }
        #nm.hidden { display: none; }
        .card { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 20px; padding: 28px 24px; width: 100%; max-width: 340px; }
        .card h2 { color: #fff; font-size: 20px; font-weight: 600; margin-bottom: 8px; }
        .card p { color: #888; font-size: 14px; margin-bottom: 20px; line-height: 1.4; }
        #ni { width: 100%; background: #2a2a2a; border: 1px solid #333; border-radius: 12px; padding: 13px 16px; color: #fff; font-size: 16px; outline: none; margin-bottom: 14px; user-select: text; }
        #ni:focus { border-color: var(--orange); }
        #nok { width: 100%; background: var(--orange); color: #000; border: none; border-radius: 12px; padding: 13px; font-size: 16px; font-weight: 600; cursor: pointer; }
        #ia { background: #111; border-top: .5px solid #1e1e1e; padding: 10px 12px; padding-bottom: calc(10px + env(safe-area-inset-bottom)); display: flex; align-items: flex-end; gap: 10px; flex-shrink: 0; }
        #mi { flex: 1; background: #1c1c1e; border: none; border-radius: 20px; padding: 10px 14px; color: #fff; font-size: 16px; outline: none; user-select: text; resize: none; max-height: 120px; overflow-y: auto; line-height: 1.4; }
        #mi::placeholder { color: #555; }
        #sb { background: var(--orange); border: none; border-radius: 50%; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
        #sb svg { width: 18px; height: 18px; fill: #000; }
        #toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(10px); background: #222; color: #fff; padding: 8px 16px; border-radius: 20px; font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 400; white-space: nowrap; }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

<!-- GAME SCREEN -->
<div id="game-app" class="screen">
    <div class="header">
        <div class="title" id="secret-title" 
             onmousedown="startHold()" onmouseup="endHold()" onmouseleave="endHold()"
             ontouchstart="startHold(event)" ontouchend="endHold()" ontouchcancel="endHold()">2048</div>
        <div class="scores">
            <div class="score-box">
                <div class="score-label">Счет</div>
                <div class="score-val" id="score">0</div>
            </div>
            <div class="score-box">
                <div class="score-label">Рекорд</div>
                <div class="score-val" id="best">0</div>
            </div>
        </div>
    </div>

    <div class="controls">
        <div class="game-intro">Соединяйте плитки!</div>
        <button class="restart-btn" onclick="initGame()">Новая игра</button>
    </div>

    <div class="grid-container" id="grid">
        <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
        <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
        <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
        <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
    </div>
</div>

<!-- CHAT SCREEN -->
<div id="cht" class="screen hidden">
    <div id="nm">
        <div class="card">
            <h2>Ваше имя</h2>
            <p>Введите имя — оно будет видно собеседнику. Выбирается один раз.</p>
            <input id="ni" type="text" placeholder="Например: Саша" maxlength="20" autocomplete="off">
            <button id="nok" onclick="saveNick()">Войти в чат</button>
        </div>
    </div>
    <div id="hdr">
        <div><div id="htitle">🔒 Личный чат</div><div id="status">подключение...</div></div>
        <button id="xbtn" onclick="closeChat()">Выйти</button>
        <button onclick="clearChat()" style="background:none;border:none;color:var(--red);font-size:15px;cursor:pointer;padding:4px 8px;">🗑</button>
    </div>
    <div id="msgs">
        <div id="empty" class="show"><span>💬</span>Сообщений пока нет.<br>Напишите что-нибудь!</div>
    </div>
    <div id="ia">
        <button onclick="document.getElementById('fi').click()" style="background:none;border:none;color:var(--orange);font-size:26px;cursor:pointer;padding:4px;flex-shrink:0;line-height:1;">📷</button>
        <input type="file" id="fi" accept="image/*" style="display:none" onchange="sendPhoto(this)">
        <textarea id="mi" placeholder="Сообщение..." rows="1" autocomplete="off"></textarea>
        <button id="sb" onclick="sendMsg()">
            <svg viewBox="0 0 24 24"><path d="M2 21L23 12 2 3v7l15 2-15 2z"/></svg>
        </button>
    </div>
</div>

<div id="toast"></div>

<script>
// ── SUPABASE CONFIG ──
const SB_URL='https://lxaatqgcfsrvycanbelm.supabase.co';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx4YWF0cWdjZnNydnljYW5iZWxtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA4MjU0ODIsImV4cCI6MjA5NjQwMTQ4Mn0.z-Pl30UQh-3GPrE6ezztZngP3fjm_vIwm9IpYkX1zfA';
const ROOM='main';
const SBH={'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json','Prefer':'return=representation'};

const dbGet=async q=>{const r=await fetch(SB_URL+'/rest/v1/'+q,{headers:SBH});if(!r.ok)throw 0;return r.json();};
const dbPost=async b=>{const r=await fetch(SB_URL+'/rest/v1/messages',{method:'POST',headers:SBH,body:JSON.stringify(b)});if(!r.ok)throw 0;return r.json();};
const dbDel=async()=>fetch(SB_URL+'/rest/v1/messages?room=eq.'+ROOM,{method:'DELETE',headers:SBH}).catch(()=>{});
const pad=n=>String(n).padStart(2,'0');

// ── SECRET HOLD FOR CHAT ──
let holdTimer = null;
function startHold(e) {
    if (e && e.cancelable) e.preventDefault();
    holdTimer = setTimeout(() => {
        holdTimer = null;
        openChat();
    }, 3000); // 3 секунды зажатия
}
function endHold() {
    if (holdTimer) {
        clearTimeout(holdTimer);
        holdTimer = null;
    }
}

// ── 2048 GAME LOGIC ──
let board = Array(16).fill(0);
let score = 0;
let best = parseInt(localStorage.getItem('2048_best') || '0');

function initGame() {
    board = Array(16).fill(0);
    score = 0;
    addTile();
    addTile();
    renderGame();
}

function addTile() {
    let empty = board.map((v, i) => v === 0 ? i : null).filter(v => v !== null);
    if (empty.length > 0) {
        let idx = empty[Math.floor(Math.random() * empty.length)];
        board[idx] = Math.random() < 0.9 ? 2 : 4;
    }
}

function renderGame() {
    document.getElementById('score').textContent = score;
    document.getElementById('best').textContent = best;
    const grid = document.getElementById('grid');
    
    // Удаляем прошлые плитки
    document.querySelectorAll('.tile').forEach(t => t.remove());

    const gridRect = grid.getBoundingClientRect();
    const padding = 12;
    const gap = 12;
    const cellSize = (gridRect.width - padding * 2 - gap * 3) / 4;

    board.forEach((val, i) => {
        if (val !== 0) {
            const tile = document.createElement('div');
            tile.className = `tile tile-${val}`;
            tile.textContent = val;
            
            const r = Math.floor(i / 4);
            const c = i % 4;
            const top = padding + r * (cellSize + gap);
            const left = padding + c * (cellSize + gap);

            tile.style.top = top + 'px';
            tile.style.left = left + 'px';

            // Если выпала 16 — навешиваем зажатие
            if (val === 16) {
                tile.addEventListener('mousedown', startHold);
                tile.addEventListener('mouseup', endHold);
                tile.addEventListener('mouseleave', endHold);
                tile.addEventListener('touchstart', startHold, {passive: false});
                tile.addEventListener('touchend', endHold);
                tile.addEventListener('touchcancel', endHold);
            }

            grid.appendChild(tile);
        }
    });
}

function slide(row) {
    let arr = row.filter(val => val);
    let missing = 4 - arr.length;
    let zeros = Array(missing).fill(0);
    return arr.concat(zeros);
}

function combine(row) {
    for (let i = 0; i < 3; i++) {
        if (row[i] !== 0 && row[i] === row[i + 1]) {
            row[i] *= 2;
            score += row[i];
            if (score > best) {
                best = score;
                localStorage.setItem('2048_best', best);
            }
            row[i + 1] = 0;
        }
    }
    return row;
}

function moveLeft() {
    let changed = false;
    for (let i = 0; i < 4; i++) {
        let row = board.slice(i * 4, i * 4 + 4);
        let orig = [...row];
        row = slide(row);
        row = combine(row);
        row = slide(row);
        for (let j = 0; j < 4; j++) {
            board[i * 4 + j] = row[j];
            if (orig[j] !== row[j]) changed = true;
        }
    }
    return changed;
}

function rotate() {
    let newBoard = Array(16).fill(0);
    for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
            newBoard[c * 4 + (3 - r)] = board[r * 4 + c];
        }
    }
    board = newBoard;
}

function move(dir) {
    let moved = false;
    let rotations = dir === 'left' ? 0 : dir === 'down' ? 1 : dir === 'right' ? 2 : 3;
    for (let i = 0; i < rotations; i++) rotate();
    moved = moveLeft();
    for (let i = 0; i < (4 - rotations) % 4; i++) rotate();

    if (moved) {
        addTile();
        renderGame();
    }
}

// Управление жестами (Swipe)
let touchX = 0, touchY = 0;
document.getElementById('grid').addEventListener('touchstart', e => {
    touchX = e.touches[0].clientX;
    touchY = e.touches[0].clientY;
}, {passive: true});

document.getElementById('grid').addEventListener('touchend', e => {
    if (!touchX || !touchY) return;
    let dx = e.changedTouches[0].clientX - touchX;
    let dy = e.changedTouches[0].clientY - touchY;
    if (Math.abs(dx) > Math.abs(dy)) {
        if (Math.abs(dx) > 30) move(dx > 0 ? 'right' : 'left');
    } else {
        if (Math.abs(dy) > 30) move(dy > 0 ? 'down' : 'up');
    }
    touchX = 0; touchY = 0;
}, {passive: true});

// Управление стрелками
document.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft') move('left');
    if (e.key === 'ArrowRight') move('right');
    if (e.key === 'ArrowUp') move('up');
    if (e.key === 'ArrowDown') move('down');
});

initGame();

// ── CHAT SYSTEM ──
let nick = localStorage.getItem('chat_nick') || '';
let lastMsgId = 0;
let pollTimer = null;

function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
}

function openChat() {
    document.getElementById('game-app').classList.add('hidden');
    document.getElementById('cht').classList.remove('hidden');
    if (!nick) {
        document.getElementById('nm').classList.remove('hidden');
    } else {
        startChat();
    }
}

function closeChat() {
    document.getElementById('cht').classList.add('hidden');
    document.getElementById('game-app').classList.remove('hidden');
    if (pollTimer) clearInterval(pollTimer);
}

function saveNick() {
    const val = document.getElementById('ni').value.trim();
    if (!val) return;
    nick = val;
    localStorage.setItem('chat_nick', nick);
    document.getElementById('nm').classList.add('hidden');
    startChat();
}

function startChat() {
    loadMsgs();
    pollTimer = setInterval(loadMsgs, 2000);
}

async function loadMsgs() {
    try {
        const data = await dbGet(`messages?room=eq.${ROOM}&order=created_at.asc`);
        document.getElementById('status').textContent = 'онлайн';
        document.getElementById('status').classList.add('on');
        
        const msgsEl = document.getElementById('msgs');
        const emptyEl = document.getElementById('empty');
        
        if (!data.length) {
            emptyEl.classList.add('show');
            return;
        }
        emptyEl.classList.remove('show');

        // Рендерим только новые сообщения
        const newMsgs = data.filter(m => m.id > lastMsgId);
        if (!newMsgs.length) return;

        newMsgs.forEach(m => {
            lastMsgId = Math.max(lastMsgId, m.id);
            const isMe = m.sender === nick;
            const mw = document.createElement('div');
            mw.className = `mw ${isMe ? 'me' : 'them'}`;
            
            const time = new Date(m.created_at).toLocaleTimeString('ru', {hour:'2-digit', minute:'2-digit'});
            
            let content = '';
            if (m.type === 'image') {
                content = `<img src="${m.text}" style="max-width:100%; border-radius:12px; display:block;">`;
            } else {
                content = m.text.replace(/</g, "&lt;").replace(/>/g, "&gt;");
            }

            mw.innerHTML = `
                <div class="lbl">${isMe ? 'Вы' : m.sender}</div>
                <div class="bbl">${content}</div>
                <div class="ts">${time}</div>
            `;
            msgsEl.appendChild(mw);
        });

        msgsEl.scrollTop = msgsEl.scrollHeight;
    } catch (e) {
        document.getElementById('status').textContent = 'ошибка';
        document.getElementById('status').classList.remove('on');
    }
}

async function sendMsg() {
    const mi = document.getElementById('mi');
    const text = mi.value.trim();
    if (!text) return;
    mi.value = '';
    mi.style.height = 'auto';

    try {
        await dbPost({ room: ROOM, sender: nick, text: text, type: 'text' });
        loadMsgs();
    } catch (e) {
        toast('Ошибка отправки');
    }
}

function sendPhoto(input) {
    const file = input.files[0];
    if (!file) return;
    const r = new FileReader();
    r.onload = async e => {
        try {
            await dbPost({ room: ROOM, sender: nick, text: e.target.result, type: 'image' });
            loadMsgs();
        } catch (err) {
            toast('Ошибка отправки фото');
        }
    };
    r.readAsDataURL(file);
    input.value = '';
}

async function clearChat() {
    if (confirm('Очистить всю историю сообщений?')) {
        await dbDel();
        document.getElementById('msgs').innerHTML = '<div id="empty" class="show"><span>💬</span>Сообщений пока нет.<br>Напишите что-нибудь!</div>';
        lastMsgId = 0;
    }
}

// Автовысота поля ввода
document.getElementById('mi').addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = this.scrollHeight + 'px';
});

// Отправка по Enter
document.getElementById('mi').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMsg();
    }
});
</script>
</body>
</html>
